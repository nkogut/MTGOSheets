debug_mode = false
start_date = 2023-01-01
min_arb_thresh = 0.05
skip_first_n_days = 14

[paths]
set_legalities = "data/set_legalities.json"
suggestion_card_blacklist = "data/suggestion_blacklist.json"
external_prices = "data/external_prices.json"
external_prices_hist = "data/external_prices_hist.json"
db = "data/prices.db"

[lists]
suggestion_option_keys = [
    "price_change", "dist_from_min", "lowest_max", "age", "price",
    "modern_only", "allow_standard", "enabled"
]
suggestion_set_blacklist = ["van", "acr", "j25"]

[xlsx_defaults]
log_path = "data/transaction_log.xlsx"
log_cols = [
    "action", "id", "name", "date", "qty", "price_each", "price_total",
    "net_each", "net_total", "holdings", "vendor", "notes"
]

wishlist_dir = "wishlists"
first_data_row = 3
blacklist_row = 1
blacklist_col = 19
suggestions_top_row = 3
suggestions_left_col = 31
cols = [
    "add_to_blacklist", "name", "set", "notes", "tag", "foil", "id",
    "date_created", "qty", "purchase_price", "", "sell_price", "buy_price", "buy_from", "sell_to",
    "delta", "delta_pct", "min", "max", "min_6_mo", "max_6_mo", "7d_delta", "30d_delta", "",
    "hit", "", "drop", "rise", "", "order",
]

sort = [
    ["qty", "<=", 0],
    ["qty", "==", -1],
    "tag",
    "name",
    "set",
    "notes",
    ["foil", false]
]

auto_update = true
ignore_for_ext_prices = false

[xlsx.debug]
path = "debug/debug.xlsx"
log_path = "debug/debug_log.xlsx"
auto_update = false
ignore_for_ext_prices = true

[xlsx.tracker]
path = "goat_tracker.xlsx"

[xlsx.lands]
path = "lands.xlsx"
sort = [
    "tag",
    ["qty", true]
]




